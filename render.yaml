services:
  - type: web
    name: aegis-x-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_NAME
        value: AEGIS-X
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./dev.db
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: PYTHON_VERSION
        value: 3.11.9
